<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recovering noch.apps</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #09090b;
        color: #f4f4f5;
        font: 16px system-ui, sans-serif;
      }
      main { text-align: center; padding: 24px; }
      p { color: #a1a1aa; }
    </style>
  </head>
  <body>
    <main>
      <h1>Recovering noch.apps…</h1>
      <p id="status">Removing the stale app cache.</p>
    </main>
    <script>
      (async () => {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations()
            await Promise.all(registrations.map(registration => registration.unregister()))
          }
          if ('caches' in window) {
            const keys = await caches.keys()
            await Promise.all(keys.map(key => caches.delete(key)))
          }
          localStorage.clear()
          sessionStorage.clear()
          location.replace(`/login?recovered=${Date.now()}`)
        } catch (error) {
          document.getElementById('status').textContent =
            'Recovery could not finish. Close this tab, reopen apps.noch.cloud, and try again.'
        }
      })()
    </script>
  </body>
</html>
