# Included inside the existing apps-site server block. No change to SPA routes.
location ^~ /api/public-menu/ {
    proxy_pass http://noch-menu-cache:8788/;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization $http_authorization;
}

location ^~ /media/ {
    proxy_pass http://noch-menu-cache:8788;
    proxy_connect_timeout 2s;
    proxy_read_timeout 40s;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    # Fill the cache with the complete file once; nginx still serves video ranges.
    proxy_set_header Range "";
    proxy_set_header If-Range "";
    proxy_force_ranges on;
    proxy_cache noch_public_media;
    proxy_cache_key $uri;
    proxy_cache_valid 200 365d;
    proxy_cache_valid 404 5m;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Noch-Media-Cache $upstream_cache_status always;
}
